name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile dan buat JAR
        run: |
          mkdir out
          javac -d out *.java
          jar cfe KasirApp.jar Main -C out .
      - uses: actions/upload-artifact@v4
        with:
          name: KasirApp
          path: KasirApp.jar
      - name: Lampirkan JAR ke Release (khusus tag v*)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: KasirApp.jar
